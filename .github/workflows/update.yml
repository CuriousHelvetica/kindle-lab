name: Update dashboard

on:
  schedule:
    # Daily at 21:15 UTC = 8:15 AM AEDT / 7:15 AM AEST. Always after the US close
    # (20:00 or 21:00 UTC), so "at last close" prices are final. GitHub may start late.
    - cron: "15 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - name: Build dashboard
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "kindle-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json assets/photo.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main   # in case you pushed while the build ran
            git push
          fi
