name: Update dashboard

on:
  schedule:
    # Daily at 4:10 PM New York time = 10 min after the US market close, all year
    # (GitHub handles US daylight saving). In Sydney that lands between 6:10 and 8:10 AM.
    # GitHub may start scheduled runs late.
    - cron: "10 16 * * *"
      timezone: "America/New_York"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - name: Build dashboard
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "kindle-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json assets/photo.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main   # in case you pushed while the build ran
            git push
          fi
