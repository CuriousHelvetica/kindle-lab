name: Update dashboard

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC); GitHub may delay a few minutes
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - name: Build dashboard
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "kindle-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data.json assets/photo.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main   # in case you pushed while the build ran
            git push
          fi
