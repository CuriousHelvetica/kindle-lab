name: Update dashboard

on:
  # No GitHub `schedule:` trigger on purpose — GitHub's scheduler proved unreliable on this
  # repo (missed two mornings, then fired 4 hours late on 2026-11-11). Instead an outside
  # timer (cron-job.org, daily 16:10 America/New_York = 10 min after the US close) starts
  # this workflow through the API. See README "Daily trigger". Manual runs: Actions tab.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pillow
      - name: Build dashboard
        run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "kindle-lab-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html data.json assets   # -A also stages removal of the old assets/photo.jpg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update dashboard $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main   # in case you pushed while the build ran
            git push
          fi
